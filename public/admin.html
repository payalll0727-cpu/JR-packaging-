<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Choudhary Paper Tube &amp; Packaging</title>
<script src="/i18n.js"></script>
<script src="/invoice.js"></script>
<style>
  :root{ --navy:#1e3a5f; --navy-dark:#152a45; --amber:#f59e0b; --bg:#f4f6f9;
    --text:#1f2937; --muted:#6b7280; --line:#e5e7eb; --green:#15803d; --red:#b91c1c; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;}
  .wrap{max-width:1100px; margin:0 auto; padding:0 14px 60px;}
  h2{font-size:1.2rem; margin:20px 0 12px;}
  button{cursor:pointer; font:inherit;}
  input,select,textarea{font:inherit; width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff;}
  label{display:block; font-size:.82rem; font-weight:600; margin:10px 0 4px; color:#374151;}
  .btn{border:none; border-radius:10px; padding:10px 16px; font-weight:700; background:var(--amber); color:#1a1a1a;}
  .btn.primary{background:var(--navy); color:#fff;}
  .btn.ghost{background:#fff; border:1px solid var(--line); color:var(--text);}
  .btn.danger{background:#fee2e2; color:var(--red);}
  .btn.wa{background:#25d366; color:#fff;}
  .btn.sm{padding:6px 10px; font-size:.82rem;}
  .btn.block{width:100%;}
  .err{color:var(--red); font-size:.85rem; margin-top:8px;}
  .ok-msg{color:var(--green); font-size:.9rem; margin-top:8px;}
  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:.75rem; font-weight:700;}
  .badge.ok{background:#dcfce7; color:var(--green);} .badge.bad{background:#fee2e2; color:var(--red);}
  .badge.info{background:#dbeafe; color:var(--navy);} .badge.warn{background:#fef3c7; color:#92400e;}

  /* LOGIN — clean rewrite 2026-10-25: plain block layout, no flex/vh centering, nothing that moves when the keyboard opens */
  #login{position:fixed; inset:0; z-index:200; background:var(--bg); overflow-y:auto; overscroll-behavior:none; padding:56px 16px 24px;}
  #login .logincard{margin:0 auto;}
  #pw{font-size:17px; padding:14px; -webkit-appearance:none; appearance:none;}
  .logincard{background:#fff; border-radius:16px; padding:28px 22px; max-width:360px; width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,.08);}
  #panel{display:none;}
  header{background:var(--navy); color:#fff; position:sticky; top:0; z-index:50;}
  .hrow{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; gap:8px;}
  .brand{font-weight:800;}
  .hbtns{display:flex; gap:8px; align-items:center;}
  .hbtn{background:transparent; border:1px solid #5b7ba3; color:#fff; border-radius:10px; padding:7px 10px; font-size:.82rem;}
  .langtoggle{display:flex; border:1px solid #5b7ba3; border-radius:10px; overflow:hidden;}
  .langtoggle button{background:transparent; border:none; color:#cbd5e1; padding:7px 10px; font-size:.82rem; font-weight:700;}
  .langtoggle button.on{background:var(--amber); color:#1a1a1a;}

  .tabs{display:flex; gap:8px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:none; position:sticky; top:57px; background:var(--bg); z-index:40;}
  .tab{flex:0 0 auto; border:1px solid var(--line); background:#fff; border-radius:20px; padding:8px 16px; font-size:.88rem; font-weight:600;}
  .tab.on{background:var(--navy); color:#fff; border-color:var(--navy);}
  .pane{display:none;} .pane.on{display:block;}

  .cards{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:6px;}
  .stat{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; text-align:center;}
  .stat .n{font-size:1.6rem; font-weight:800; color:var(--navy);}
  .stat .l{font-size:.8rem; color:var(--muted);}
  table.grid{width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; font-size:.88rem; margin-top:10px;}
  table.grid th, table.grid td{border-bottom:1px solid var(--line); padding:10px 8px; text-align:left; vertical-align:top;}
  table.grid th{background:#f8fafc; font-size:.78rem; text-transform:uppercase; color:var(--muted);}
  .tblwrap{overflow-x:auto;}

  .ocard{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:10px;}
  .orow{display:flex; justify-content:space-between; gap:8px; font-size:.88rem; padding:2px 0; flex-wrap:wrap;}
  .oitems{font-size:.82rem; color:var(--muted); margin:6px 0;}
  .oactions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center;}
  .oactions select{width:auto;}

  .pedit{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:10px;}
  .vrow{display:flex; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:.88rem; flex-wrap:wrap;}
  .vrow .grow{flex:1; min-width:120px;}
  .formgrid{display:grid; grid-template-columns:1fr 1fr; gap:0 12px;}
  @media(max-width:600px){.formgrid{grid-template-columns:1fr;} .cards{grid-template-columns:1fr 1fr 1fr;}}

  .modal{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:100; padding:16px;}
  .modal.open{display:flex;}
  .mbox{background:#fff; border-radius:16px; padding:24px 20px; max-width:440px; width:100%; max-height:90vh; overflow-y:auto;}
  .mbox h3{margin:0 0 6px;}
  .linkbox{background:#f3f4f6; border:1px dashed #9ca3af; border-radius:10px; padding:10px; font-size:.82rem; word-break:break-all; margin:10px 0;}

  .livedot{display:inline-block; width:10px; height:10px; border-radius:50%; background:#22c55e; margin-right:6px; animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  #printwrap{display:none;}
  .inv{font-family:Arial,sans-serif; color:#111; max-width:700px; margin:0 auto; background:#fff; padding:10px;}
  .inv-head{text-align:center; border-bottom:2px solid #111; padding-bottom:10px; margin-bottom:10px;}
  .inv-brand{font-size:2rem; font-weight:900;} .inv-head h2{margin:4px 0;}
  .inv-title{font-size:1.2rem; font-weight:800; margin-top:8px; text-transform:uppercase;}
  .inv-meta{display:flex; flex-wrap:wrap; gap:6px 24px; margin-bottom:10px; font-size:.9rem;}
  .inv-table{width:100%; border-collapse:collapse; font-size:.88rem;}
  .inv-table th,.inv-table td{border:1px solid #999; padding:6px 8px; text-align:left;}
  .inv-table .r,.inv-totals .r{text-align:right;}
  .inv-totals{width:60%; margin-left:auto; border-collapse:collapse; font-size:.9rem; margin-top:8px;}
  .inv-totals td{border:1px solid #999; padding:6px 8px;}
  .inv-totals .grand{font-weight:800;}
  .inv-words,.inv-note{font-size:.85rem; margin-top:10px;}
  .inv-sign{text-align:right; margin-top:24px; font-size:.9rem;}
  @media print{ body.printing > *:not(#printwrap){display:none !important;} #printwrap{display:block !important;} }
</style>
</head>
<body>

<!-- login -->
<div id="login">
  <div class="logincard">
    <h2 style="margin-top:0">Choudhary <span data-i18n="adm_title"></span></h2>
    <form id="loginform">
      <input type="text" name="username" value="admin" autocomplete="username" style="display:none" aria-hidden="true" tabindex="-1">
      <label for="pw" data-i18n="adm_pw"></label>
      <input id="pw" type="password" name="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <div class="err" id="pw-err"></div>
      <button class="btn primary block" id="pw-go" type="submit" style="margin-top:12px" data-i18n="adm_go"></button>
    </form>
  </div>
</div>

<!-- panel -->
<div id="panel">
  <header><div class="wrap hrow" style="padding-left:0;padding-right:0">
    <div class="brand">Choudhary <span data-i18n="adm_title"></span></div>
    <div class="hbtns">
      <div class="langtoggle"><button data-lang="en">EN</button><button data-lang="hi">हिं</button></div>
      <button class="hbtn" id="logout" data-i18n="cm_logout"></button>
    </div>
  </div></header>
  <div class="wrap">
    <div class="tabs" id="tabs"></div>

    <div class="pane" id="pane-dash">
      <h2 data-i18n="tab_dash"></h2>
      <div class="cards" id="dash-cards"></div>
      <div style="display:flex; gap:10px; align-items:flex-end; margin-top:16px; flex-wrap:wrap">
        <div><label data-i18n="d_pick"></label><input type="date" id="dash-date" style="width:auto"></div>
        <button class="btn ghost" id="dash-go">→</button>
      </div>
      <div class="tblwrap"><table class="grid" id="dash-week"></table></div>
      <h2 data-i18n="x_range"></h2>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end">
        <div><label data-i18n="x_range"></label>
          <select id="x-range" style="width:auto">
            <option value="today" data-i18n="x_today"></option>
            <option value="7d" data-i18n="x_7d"></option>
            <option value="30d" data-i18n="x_30d"></option>
            <option value="all" data-i18n="x_all"></option>
          </select></div>
        <button class="btn primary" id="x-orders" data-i18n="x_orders"></button>
        <button class="btn primary" id="x-customers" data-i18n="x_customers"></button>
      </div>
    </div>

    <div class="pane" id="pane-orders"><h2 data-i18n="tab_orders"></h2><div id="orders-list"></div></div>
    <div class="pane" id="pane-quotes"><h2 data-i18n="tab_quotes"></h2><div id="quotes-list"></div></div>

    <div class="pane" id="pane-products">
      <h2 data-i18n="tab_products"></h2>
      <button class="btn" id="p-add" data-i18n="p_add_product"></button>
      <div id="products-list"></div>
    </div>

    <div class="pane" id="pane-visitors"><h2 data-i18n="tab_visitors"></h2><div id="visitors-list"></div></div>
    <div class="pane" id="pane-customers"><h2 data-i18n="tab_customers"></h2><div id="customers-list"></div></div>
    <div class="pane" id="pane-live"><h2><span class="livedot"></span><span id="live-count"></span></h2><div id="live-list"></div></div>

    <div class="pane" id="pane-banner">
      <h2 data-i18n="tab_banner"></h2>
      <p style="color:var(--muted); font-size:.88rem" data-i18n="b_hint"></p>
      <label data-i18n="b_en"></label><textarea id="b-en" rows="2"></textarea>
      <label data-i18n="b_hi"></label><textarea id="b-hi" rows="2"></textarea>
      <div class="ok-msg" id="b-ok"></div>
      <div style="display:flex; gap:8px; margin-top:10px">
        <button class="btn primary" id="b-save" data-i18n="b_save"></button>
        <button class="btn ghost" id="b-clear" data-i18n="b_clear"></button>
      </div>
    </div>

    <div class="pane" id="pane-blocks">
      <h2 data-i18n="tab_blocks"></h2>
      <div class="pedit">
        <div class="formgrid">
          <div><label data-i18n="bl_phone"></label><input id="bl-phone" inputmode="numeric" maxlength="10"></div>
          <div><label data-i18n="bl_reason"></label><input id="bl-reason"></div>
        </div>
        <div class="err" id="bl-err"></div><div class="ok-msg" id="bl-ok"></div>
        <button class="btn danger" id="bl-add" style="margin-top:10px" data-i18n="bl_add"></button>
      </div>
      <div id="blocks-list"></div>
    </div>
  </div>
</div>

<!-- quote → order modal -->
<div class="modal" id="convmodal">
  <div class="mbox">
    <h3 data-i18n="q_convert"></h3>
    <div id="conv-quote-info" style="font-size:.88rem; color:var(--muted)"></div>
    <label data-i18n="q_item"></label><input id="conv-item">
    <div class="formgrid">
      <div><label data-i18n="q_price"></label><input id="conv-price" inputmode="decimal"></div>
      <div><label data-i18n="q_qty2"></label><input id="conv-qty" inputmode="numeric" value="1"></div>
    </div>
    <div class="err" id="conv-err"></div>
    <button class="btn primary block" id="conv-make" style="margin-top:10px" data-i18n="q_make"></button>
    <div id="conv-linkbox" style="display:none">
      <label data-i18n="q_link"></label>
      <div class="linkbox" id="conv-link"></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn ghost sm" id="conv-copy" data-i18n="q_copy"></button>
        <a class="btn wa sm" id="conv-wa" target="_blank" rel="noopener" data-i18n="q_wa_send" style="text-decoration:none"></a>
      </div>
    </div>
    <button class="btn ghost block" id="conv-close" style="margin-top:10px" data-i18n="cm_close"></button>
  </div>
</div>

<div id="printwrap"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const money = (n) => "₹" + Number(n).toLocaleString("en-IN");
const PHONE_RE = /^[6-9]\d{9}$/;
let PW = sessionStorage.getItem("jrpt_admin_pw") || "";
let CATALOG = null;

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", "x-admin-password": PW, ...(opts.headers || {}) },
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { doLogout(); throw new Error("Unauthorized"); }
  if (!r.ok) throw new Error(d.error || "Request failed.");
  return d;
}
function applyI18n() {
  const lang = getLang();
  document.documentElement.lang = lang === "hi" ? "hi" : "en";
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".langtoggle button").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
  renderTabs();
  const active = document.querySelector(".pane.on");
  if (active) loadPane(active.id.replace("pane-", ""));
}
document.querySelectorAll(".langtoggle button").forEach((b) =>
  b.addEventListener("click", () => { setLang(b.dataset.lang); applyI18n(); }));

/* ---------- login ---------- */
function doLogout() { sessionStorage.removeItem("jrpt_admin_pw"); location.reload(); }
$("logout").onclick = doLogout;
async function tryLogin() {
  $("pw-err").textContent = "";
  PW = $("pw").value;
  try {
    await api("/api/admin/orders");
    sessionStorage.setItem("jrpt_admin_pw", PW);
    boot();
  } catch (e) { $("pw-err").textContent = t("adm_wrong"); PW = ""; }
}
$("loginform").addEventListener("submit", (e) => { e.preventDefault(); tryLogin(); });

/* ---------- tabs ---------- */
const TABS = ["dash", "orders", "quotes", "products", "visitors", "customers", "live", "banner", "blocks"];
function renderTabs() {
  $("tabs").innerHTML = TABS.map((k) =>
    `<button class="tab" data-tab="${k}">${t("tab_" + k)}</button>`).join("");
  document.querySelectorAll(".tab").forEach((b) =>
    b.addEventListener("click", () => showPane(b.dataset.tab)));
  const cur = document.querySelector(".pane.on");
  showPane(cur ? cur.id.replace("pane-", "") : "dash", true);
}
function showPane(k, skipLoad) {
  document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.tab === k));
  document.querySelectorAll(".pane").forEach((p) => p.classList.toggle("on", p.id === "pane-" + k));
  if (!skipLoad) loadPane(k);
}
let liveTimer = null;
function loadPane(k) {
  clearInterval(liveTimer);
  ({ dash: loadDash, orders: loadOrders, quotes: loadQuotes, products: loadProducts,
     visitors: loadVisitors, customers: loadCustomers, live: loadLive,
     banner: loadBanner, blocks: loadBlocks })[k]();
  if (k === "live") liveTimer = setInterval(loadLive, 15000);
}

/* ---------- dashboard ---------- */
async function loadDash() {
  const today = new Date().toISOString().slice(0, 10);
  if (!$("dash-date").value) $("dash-date").value = today;
  const s = await api(`/api/admin/summary?date=${$("dash-date").value}`);
  $("dash-cards").innerHTML = `
    <div class="stat"><div class="n">${s.orders}</div><div class="l">${t("d_orders")} · ${s.date}</div></div>
    <div class="stat"><div class="n">${money(s.revenue)}</div><div class="l">${t("d_revenue")}</div></div>
    <div class="stat"><div class="n">${money(s.avg_order_value)}</div><div class="l">${t("d_aov")}</div></div>`;
  const week = await api("/api/admin/summary/week");
  $("dash-week").innerHTML = `<tr><th>${t("th_date")}</th><th>${t("th_orders")}</th><th>${t("th_revenue")}</th><th>${t("th_aov")}</th></tr>` +
    week.map((w) => `<tr><td>${w.date}</td><td>${w.orders}</td><td>${money(w.revenue)}</td><td>${money(w.avg_order_value)}</td></tr>`).join("");
}
$("dash-go").onclick = loadDash;

/* ---------- orders ---------- */
const payBadge = (p) => p === "paid" ? "ok" : p === "failed" ? "bad" : "info";
async function loadOrders() {
  const box = $("orders-list");
  box.innerHTML = t("cm_loading");
  const orders = await api("/api/admin/orders");
  if (!orders.length) { box.innerHTML = `<p style="color:var(--muted)">${t("o_empty")}</p>`; return; }
  const statuses = ["New", "Confirmed", "Packed", "Dispatched", "Delivered", "Cancelled"];
  box.innerHTML = orders.map((o) => `
    <div class="ocard">
      <div class="orow"><strong>${o.order_number}</strong>
        <span class="badge ${payBadge(o.payment_status)}">${t("pay_" + o.payment_status)}</span></div>
      <div class="orow"><span>${t("o_customer")}</span><span>${o.name} · ${o.phone}</span></div>
      <div class="orow"><span>${t("o_date")}</span><span>${o.created_at.slice(0, 16).replace("T", " ")}</span></div>
      <div class="orow"><span>${t("o_fulfill")}</span><span>${o.fulfillment === "pickup" ? t("pickup") : t("delivery_opt")}</span></div>
      <div class="oitems">${o.items.map((l) => `${l.qty} × ${l.name} (${l.variant_label}) — ${money(l.line_total)}`).join("<br>")}</div>
      <div class="orow"><strong>${t("o_amount")}</strong><strong>${money(o.total)}</strong></div>
      <div class="oactions">
        <select data-st="${o.id}">${statuses.map((s) => `<option${s === o.status ? " selected" : ""}>${s}</option>`).join("")}</select>
        <button class="btn sm ghost" data-inv="${o.id}">${t("o_invoice")}</button>
        <button class="btn sm wa" data-wa="${o.id}">${t("o_notify")}</button>
      </div>
    </div>`).join("");
  box.querySelectorAll("[data-st]").forEach((sel) => sel.addEventListener("change", async () => {
    await api(`/api/admin/orders/${sel.dataset.st}`, { method: "PATCH", body: JSON.stringify({ status: sel.value }) });
    loadOrders();
  }));
  box.querySelectorAll("[data-inv]").forEach((b) => b.onclick = () => printInvoice(`/api/admin/orders/${b.dataset.inv}/invoice`));
  box.querySelectorAll("[data-wa]").forEach((b) => b.onclick = () => {
    const o = orders.find((x) => x.id == b.dataset.wa);
    const msg = waStatusText(o.name, o.order_number, o.status);
    window.open(`https://wa.me/91${o.phone}?text=${encodeURIComponent(msg)}`, "_blank");
  });
}
async function printInvoice(url) {
  const inv = await api(url);
  $("printwrap").innerHTML = renderInvoice(inv);
  document.body.classList.add("printing");
  window.print();
  setTimeout(() => document.body.classList.remove("printing"), 500);
}

/* ---------- quotes ---------- */
async function loadQuotes() {
  const box = $("quotes-list");
  box.innerHTML = t("cm_loading");
  const qs = await api("/api/admin/quotes");
  if (!qs.length) { box.innerHTML = `<p style="color:var(--muted)">${t("q_empty")}</p>`; return; }
  const qst = ["New", "Quoted", "Converted", "Rejected"];
  box.innerHTML = qs.map((q) => `
    <div class="ocard">
      <div class="orow"><strong>${q.quote_number}</strong><span class="badge ${q.status === "New" ? "warn" : q.status === "Converted" ? "ok" : q.status === "Rejected" ? "bad" : "info"}">${t("q_" + q.status)}</span></div>
      <div class="orow"><span>${t("q_customer")}</span><span>${q.name} · ${q.phone}</span></div>
      <div class="orow"><span>${t("q_type")}</span><span>${q.product_type}</span></div>
      <div class="orow"><span>${t("q_dims")}</span><span>${q.dimensions}</span></div>
      <div class="orow"><span>${t("q_qty")}</span><span>${q.quantity}</span></div>
      ${q.notes ? `<div class="oitems">${t("q_notes")}: ${q.notes}</div>` : ""}
      <div class="oactions">
        <select data-qs="${q.id}">${qst.map((s) => `<option${s === q.status ? " selected" : ""}>${s}</option>`).join("")}</select>
        <button class="btn sm primary" data-conv="${q.id}">${t("q_convert")}</button>
      </div>
    </div>`).join("");
  box.querySelectorAll("[data-qs]").forEach((sel) => sel.addEventListener("change", async () => {
    await api(`/api/admin/quotes/${sel.dataset.qs}`, { method: "PATCH", body: JSON.stringify({ status: sel.value }) });
    loadQuotes();
  }));
  box.querySelectorAll("[data-conv]").forEach((b) => b.onclick = () => openConvert(qs.find((x) => x.id == b.dataset.conv)));
}
let convQuote = null;
function openConvert(q) {
  convQuote = q;
  $("conv-err").textContent = "";
  $("conv-linkbox").style.display = "none";
  $("conv-quote-info").textContent = `${q.quote_number} · ${q.name} · ${q.phone} · ${q.product_type} — ${q.dimensions} × ${q.quantity}`;
  $("conv-item").value = `${q.product_type} — ${q.dimensions}`;
  $("conv-price").value = ""; $("conv-qty").value = q.quantity.replace(/\D/g, "") || "1";
  $("convmodal").classList.add("open");
}
$("conv-close").onclick = () => $("convmodal").classList.remove("open");
$("conv-copy").onclick = () => { navigator.clipboard.writeText($("conv-link").textContent); $("conv-copy").textContent = t("q_copied"); };
$("conv-make").onclick = async () => {
  const err = $("conv-err");
  err.textContent = "";
  const price = Number($("conv-price").value), qty = Number($("conv-qty").value) || 1;
  if (!(price > 0)) { err.textContent = t("q_price"); return; }
  try {
    const d = await api(`/api/admin/quotes/${convQuote.id}/convert`, {
      method: "POST", body: JSON.stringify({ price, qty, item_label: $("conv-item").value }),
    });
    $("conv-link").textContent = d.link;
    $("conv-linkbox").style.display = "block";
    const msg = getLang() === "hi"
      ? `नमस्ते ${convQuote.name}, आपके कोटेशन का ऑर्डर लिंक: ${d.link} - Choudhary Paper Tube & Packaging`
      : `Hello ${convQuote.name}, your order link for the quotation: ${d.link} - Choudhary Paper Tube & Packaging`;
    $("conv-wa").href = `https://wa.me/91${convQuote.phone}?text=${encodeURIComponent(msg)}`;
    loadQuotes();
  } catch (e) { err.textContent = e.message; }
};

/* ---------- products ---------- */
async function loadProducts() {
  CATALOG = await api("/api/admin/products");
  renderProducts();
}
function renderProducts() {
  const box = $("products-list");
  box.innerHTML = CATALOG.products.map((p) => `
    <div class="pedit" data-p="${p.id}">
      <div class="orow"><strong>${p.name}</strong><span class="badge info">${p.category}</span></div>
      <div style="font-size:.82rem; color:var(--muted)">${p.description || ""} ${p.hsn ? "· HSN " + p.hsn : ""}</div>
      <div style="margin-top:8px"><strong style="font-size:.85rem">${t("p_variants")}</strong></div>
      ${p.variants.length ? p.variants.map((v) => `
        <div class="vrow">
          <span class="grow"><strong>${v.label}</strong><br>
            <small style="color:var(--muted)">${v.sku} · ${money(v.price)} / ${v.unit} · ${t("p_stock")}: ${v.stock}</small></span>
          <button class="btn sm ghost" data-ve="${p.id}|${v.sku}">${t("cm_edit")}</button>
          <button class="btn sm danger" data-vd="${p.id}|${v.sku}">✕</button>
        </div>`).join("") : `<div style="font-size:.85rem;color:var(--muted)">${t("p_no_variants")}</div>`}
      <div class="vform" data-vf="${p.id}" style="display:none; margin-top:8px; border-top:1px dashed var(--line); padding-top:8px">
        <div class="formgrid">
          <div><label>${t("p_label")}</label><input data-f="label"></div>
          <div><label>${t("p_unit")}</label><input data-f="unit" value="pc"></div>
          <div><label>${t("p_price")}</label><input data-f="price" inputmode="decimal"></div>
          <div><label>${t("p_stock")}</label><input data-f="stock" inputmode="numeric" value="0"></div>
        </div>
        <div style="display:flex; gap:8px; margin-top:8px">
          <button class="btn sm primary" data-vs="${p.id}">${t("cm_save")}</button>
          <button class="btn sm ghost" data-vc="${p.id}">${t("cm_cancel")}</button>
        </div>
      </div>
      <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap">
        <button class="btn sm ghost" data-va="${p.id}">${t("p_add_variant")}</button>
        <button class="btn sm ghost" data-pe="${p.id}">${t("p_edit")}</button>
        <button class="btn sm danger" data-pd="${p.id}">${t("p_delete")}</button>
      </div>
      <div class="pform" data-pf="${p.id}" style="display:none; margin-top:8px; border-top:1px dashed var(--line); padding-top:8px">
        <div class="formgrid">
          <div><label>${t("p_name")}</label><input data-f="name" value="${p.name.replace(/"/g, "&quot;")}"></div>
          <div><label>${t("p_category")}</label><input data-f="category" list="catlist" value="${p.category.replace(/"/g, "&quot;")}"></div>
          <div><label>${t("p_desc")}</label><input data-f="description" value="${(p.description || "").replace(/"/g, "&quot;")}"></div>
          <div><label>${t("p_hsn")}</label><input data-f="hsn" value="${(p.hsn || "").replace(/"/g, "&quot;")}"></div>
        </div>
        <div style="display:flex; gap:8px; margin-top:8px">
          <button class="btn sm primary" data-ps="${p.id}">${t("cm_save")}</button>
          <button class="btn sm ghost" data-pc="${p.id}">${t("cm_cancel")}</button>
        </div>
      </div>
    </div>`).join("") +
    `<datalist id="catlist">${CATALOG.categories.map((c) => `<option value="${c}">`).join("")}</datalist>`;

  const val = (root, k) => root.querySelector(`[data-f="${k}"]`).value;
  // add product
  $("p-add").onclick = () => {
    const name = prompt(t("p_name"));
    if (!name) return;
    api("/api/admin/products", { method: "POST", body: JSON.stringify({ name }) }).then(loadProducts).catch((e) => alert(e.message));
  };
  box.querySelectorAll("[data-pd]").forEach((b) => b.onclick = async () => {
    if (!confirm(t("p_del_confirm"))) return;
    await api(`/api/admin/products/${b.dataset.pd}`, { method: "DELETE" });
    loadProducts();
  });
  box.querySelectorAll("[data-pe]").forEach((b) => b.onclick = () => {
    box.querySelector(`[data-pf="${b.dataset.pe}"]`).style.display = "block";
  });
  box.querySelectorAll("[data-pc]").forEach((b) => b.onclick = () => {
    box.querySelector(`[data-pf="${b.dataset.pc}"]`).style.display = "none";
  });
  box.querySelectorAll("[data-ps]").forEach((b) => b.onclick = async () => {
    const root = box.querySelector(`[data-pf="${b.dataset.ps}"]`);
    await api(`/api/admin/products/${b.dataset.ps}`, { method: "PUT",
      body: JSON.stringify({ name: val(root, "name"), category: val(root, "category"), description: val(root, "description"), hsn: val(root, "hsn") }) });
    loadProducts();
  });
  // variants
  box.querySelectorAll("[data-va]").forEach((b) => b.onclick = () => {
    const f = box.querySelector(`[data-vf="${b.dataset.va}"]`);
    f.style.display = "block"; f.dataset.editSku = "";
  });
  box.querySelectorAll("[data-vc]").forEach((b) => b.onclick = () => {
    box.querySelector(`[data-vf="${b.dataset.vc}"]`).style.display = "none";
  });
  box.querySelectorAll("[data-ve]").forEach((b) => b.onclick = () => {
    const [pid, sku] = b.dataset.ve.split("|");
    const p = CATALOG.products.find((x) => x.id === pid);
    const v = p.variants.find((x) => x.sku === sku);
    const f = box.querySelector(`[data-vf="${pid}"]`);
    f.style.display = "block"; f.dataset.editSku = sku;
    f.querySelector('[data-f="label"]').value = v.label;
    f.querySelector('[data-f="unit"]').value = v.unit;
    f.querySelector('[data-f="price"]').value = v.price;
    f.querySelector('[data-f="stock"]').value = v.stock;
  });
  box.querySelectorAll("[data-vs]").forEach((b) => b.onclick = async () => {
    const f = box.querySelector(`[data-vf="${b.dataset.vs}"]`);
    const body = { label: val(f, "label"), unit: val(f, "unit"), price: val(f, "price"), stock: val(f, "stock") };
    try {
      if (f.dataset.editSku) await api(`/api/admin/products/${b.dataset.vs}/variants/${f.dataset.editSku}`, { method: "PUT", body: JSON.stringify(body) });
      else await api(`/api/admin/products/${b.dataset.vs}/variants`, { method: "POST", body: JSON.stringify(body) });
      loadProducts();
    } catch (e) { alert(e.message); }
  });
  box.querySelectorAll("[data-vd]").forEach((b) => b.onclick = async () => {
    if (!confirm(t("p_del_confirm"))) return;
    const [pid, sku] = b.dataset.vd.split("|");
    await api(`/api/admin/products/${pid}/variants/${sku}`, { method: "DELETE" });
    loadProducts();
  });
}

/* ---------- visitors ---------- */
async function loadVisitors() {
  const vs = await api("/api/admin/visitors");
  $("visitors-list").innerHTML = vs.length ? `
    <div class="tblwrap"><table class="grid">
      <tr><th>${t("v_name")}</th><th>${t("v_phone")}</th><th>${t("v_email")}</th><th>${t("v_entered")}</th><th>${t("v_lastseen")}</th><th>${t("v_page")}</th><th></th></tr>
      ${vs.map((v) => `<tr><td>${v.name}</td><td>${v.phone}</td><td>${v.email || "—"}</td>
        <td>${v.entered_at.slice(0, 16).replace("T", " ")}</td>
        <td>${v.last_seen_at.slice(0, 16).replace("T", " ")}</td>
        <td>${v.current_page || "—"}</td>
        <td><button class="btn sm danger" data-bl="${v.phone}">${t("v_block")}</button></td></tr>`).join("")}
    </table></div>`
    : `<p style="color:var(--muted)">${t("v_empty")}</p>`;
  document.querySelectorAll("[data-bl]").forEach((b) => b.onclick = async () => {
    await api("/api/admin/blocks", { method: "POST", body: JSON.stringify({ phone: b.dataset.bl, reason: "Blocked from visitors" }) });
    alert(t("bl_added"));
  });
}

/* ---------- customers ---------- */
async function loadCustomers() {
  const cs = await api("/api/admin/customers");
  if (!cs.length) { $("customers-list").innerHTML = `<p style="color:var(--muted)">${t("c_empty")}</p>`; return; }
  $("customers-list").innerHTML = cs.map((c, i) => `
    <div class="ocard">
      <div class="orow"><strong>${c.name}</strong>
        ${c.repeat_buyer ? `<span class="badge ok">${t("c_repeat")}</span>` : `<span class="badge info">${t("c_no")}</span>`}</div>
      <div class="orow"><span>${t("v_phone")}</span><span>${c.phone}</span></div>
      ${c.email ? `<div class="orow"><span>${t("v_email")}</span><span>${c.email}</span></div>` : ""}
      <div class="orow"><span>${t("c_orders")}</span><span>${c.order_count} (${c.paid_order_count} ${t("pay_paid").toLowerCase()})</span></div>
      <div class="orow"><span>${t("c_spent")}</span><strong>${money(c.total_spent)}</strong></div>
      <div class="orow"><span>${t("c_last")}</span><span>${(c.last_order_at || "").slice(0, 10)}</span></div>
      <button class="btn sm ghost" data-co="${i}" style="margin-top:6px">${t("c_view")}</button>
      <div class="oitems" id="co-${i}" style="display:none">${c.orders.map((o) =>
        `${o.order_number} · ${o.created_at.slice(0, 10)} · ${money(o.total)} · ${t("st_" + o.status)} · ${t("pay_" + o.payment_status)}`).join("<br>")}</div>
    </div>`).join("");
  document.querySelectorAll("[data-co]").forEach((b) => b.onclick = () => {
    const el = $("co-" + b.dataset.co);
    el.style.display = el.style.display === "none" ? "block" : "none";
  });
}

/* ---------- live ---------- */
function fmtDur(s) {
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  return m < 60 ? m + "m" : Math.floor(m / 60) + "h " + (m % 60) + "m";
}
async function loadLive() {
  const vs = await api("/api/admin/live");
  $("live-count").textContent = `${vs.length} ${t("l_online")}`;
  $("live-list").innerHTML = vs.length ? vs.map((v) => `
    <div class="ocard"><div class="orow"><strong><span class="livedot"></span>${v.name}</strong><span>${v.phone}</span></div>
      ${v.email ? `<div class="orow"><span>${t("v_email")}</span><span>${v.email}</span></div>` : ""}
      <div class="orow"><span>${t("l_page")}</span><span>${v.current_page || "—"}</span></div>
      <div class="orow"><span>${t("l_time_on")}</span><span>${fmtDur(v.seconds_on_site)}</span></div>
    </div>`).join("")
    : `<p style="color:var(--muted)">${t("l_empty")}</p>`;
}

/* ---------- banner ---------- */
async function loadBanner() {
  const r = await fetch("/api/announcement").then((x) => x.json());
  $("b-en").value = r.en || ""; $("b-hi").value = r.hi || "";
}
$("b-save").onclick = async () => {
  await api("/api/admin/announcement", { method: "PUT", body: JSON.stringify({ en: $("b-en").value, hi: $("b-hi").value }) });
  $("b-ok").textContent = t("b_saved");
  setTimeout(() => $("b-ok").textContent = "", 2000);
};
$("b-clear").onclick = async () => {
  $("b-en").value = ""; $("b-hi").value = "";
  await api("/api/admin/announcement", { method: "PUT", body: JSON.stringify({ en: "", hi: "" }) });
  $("b-ok").textContent = t("b_saved");
  setTimeout(() => $("b-ok").textContent = "", 2000);
};

/* ---------- blocks ---------- */
async function loadBlocks() {
  const bs = await api("/api/admin/blocks");
  $("blocks-list").innerHTML = bs.length ? bs.map((b) => `
    <div class="vrow"><span class="grow"><strong>${b.phone}</strong><br>
      <small style="color:var(--muted)">${b.reason || ""} · ${b.created_at.slice(0, 10)}</small></span>
      <button class="btn sm ghost" data-ub="${b.phone}">${t("bl_unblock")}</button></div>`).join("")
    : `<p style="color:var(--muted)">${t("bl_empty")}</p>`;
  document.querySelectorAll("[data-ub]").forEach((x) => x.onclick = async () => {
    await api(`/api/admin/blocks/${x.dataset.ub}`, { method: "DELETE" });
    loadBlocks();
  });
}
$("bl-add").onclick = async () => {
  const err = $("bl-err"), ok = $("bl-ok");
  err.textContent = ""; ok.textContent = "";
  const phone = $("bl-phone").value.trim().replace(/[\s-]/g, "");
  if (!PHONE_RE.test(phone)) { err.textContent = t("err_phone"); return; }
  await api("/api/admin/blocks", { method: "POST", body: JSON.stringify({ phone, reason: $("bl-reason").value }) });
  ok.textContent = t("bl_added");
  $("bl-phone").value = ""; $("bl-reason").value = "";
  loadBlocks();
};

/* ---------- excel export ---------- */
async function downloadXlsx(kind) {
  const range = $("x-range").value;
  const r = await fetch(`/api/admin/export/${kind}.xlsx?range=${range}`, {
    headers: { "x-admin-password": PW },
  });
  if (!r.ok) throw new Error("Export failed.");
  const blob = await r.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${kind}-${range}.xlsx`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$("x-orders").onclick = () => downloadXlsx("orders").catch((e) => alert(e.message));
$("x-customers").onclick = () => downloadXlsx("customers").catch((e) => alert(e.message));

/* ---------- boot ---------- */
function boot() {
  $("login").style.display = "none";
  $("panel").style.display = "block";
  applyI18n();
}
if (PW) {
  api("/api/admin/orders").then(boot).catch(() => {
    sessionStorage.removeItem("jrpt_admin_pw"); PW = "";
    $("login").style.display = "flex"; applyI18n();
  });
} else {
  $("login").style.display = "flex";
  applyI18n();
}
</script>
